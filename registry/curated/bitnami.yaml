  - id: bitnami/helm-charts
    title: Bitnami Helm charts frozen and their default images removed
    vendor: Bitnami (Broadcom)
    kind: removed
    effective: 2025-09-29
    replacement: >-
      Override every image to bitnamilegacy/* as a stopgap, then move to an upstream chart or
      operator
    summary: >-
      Packaged charts stay downloadable but get no updates, and they do not deploy out of the box
      because their default images were removed (except images in the free bitnamisecure subset).
    source: https://github.com/bitnami/containers/issues/83267
    last_verified: 2026-11-27
    affected:
      - type: literal
        ids:
          - charts.bitnami.com/bitnami
          - registry-1.docker.io/bitnamicharts
          - docker.io/bitnamicharts
  - id: bitnami/other-images
    title: Bitnami image removed from the free docker.io/bitnami catalog
    vendor: Bitnami (Broadcom)
    kind: removed
    effective: 2025-09-29
    replacement: >-
      An upstream or otherwise maintained image; bitnamilegacy/<image> works as an unpatched
      stopgap
    summary: >-
      On 2025-09-29 the free docker.io/bitnami catalog was deleted: versioned images moved to the
      unmaintained docker.io/bitnamilegacy, and only a small hardened subset stayed free (latest
      tag only) under bitnamisecure. Pulls of docker.io/bitnami/<image>:<version> fail. Sealed
      Secrets, charts-syncer and minideb are unaffected.
    source: https://github.com/bitnami/containers/issues/83267
    last_verified: 2026-11-27
    fallback: true
    affected:
      - type: pattern
        pattern: >-
          (?<![A-Za-z0-9_.\-/])(?:docker\.io/)?bitnami/(?!sealed-secrets|charts-syncer|minideb)[a-z0-9][a-z0-9._-]*
