# Bitnami catalog change (docker.io/bitnami deleted 2025-09-29), per
# https://github.com/bitnami/containers/issues/83267 (verified 2026-11-27).
# bitnami/other-images is a catch-all; specific entries win on the same line.
schema_version: 1
advisories:
  - id: bitnami/postgresql
    title: Bitnami image bitnami/postgresql removed from the free catalog
    vendor: Bitnami (Broadcom)
    kind: removed
    effective: 2025-09-29
    replacement: >-
      postgres (Docker Official Image); bitnamilegacy/postgresql works as an unpatched stopgap
    summary: >-
      On 2025-09-29 the free docker.io/bitnami catalog was deleted: versioned images moved to the
      unmaintained docker.io/bitnamilegacy, and only a small hardened subset stayed free (latest
      tag only) under bitnamisecure. Pulls of docker.io/bitnami/<image>:<version> fail.
    source: https://github.com/bitnami/containers/issues/83267
    last_verified: 2026-11-27
    affected:
      - type: image
        ids: [bitnami/postgresql]
