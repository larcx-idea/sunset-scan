    title: 'Meta Marketing API: applink_treatment=web_only rejected for Website and App campaigns'
    vendor: Meta
    kind: behavior-change
    effective: 2026-10-27
    announced: 2026-07-29
    replacement: Automatic destination selection or a compatible manual destination
    source: https://developers.facebook.com/docs/graph-api/changelog/version26.0
    last_verified: 2026-11-27
    affected:
      - type: pattern
        pattern: applink_treatment["']?\s*[:=]\s*["']?web_only
  - id: meta/marketing-messenger-stories-placement
    title: 'Meta Marketing API: Messenger Stories placement removed'
    vendor: Meta
    kind: removed
    effective: 2026-10-27
    announced: 2026-07-29
    replacement: Remove 'story' from messenger_positions (Advantage+ Placements need no change)
    source: https://developers.facebook.com/docs/graph-api/changelog/version26.0
    last_verified: 2026-11-27
    affected:
      - type: pattern
        pattern: messenger_positions["']?\s*[:=]\s*\[[^\]]*["']story["']
  - id: meta/marketing-poll-ads
    title: 'Meta Marketing API: creating or updating poll ads fails'
    vendor: Meta
    kind: shutdown
    effective: 2026-10-27
    announced: 2026-07-29
    replacement: None; remove poll_spec and poll interactive components from creatives
    source: https://developers.facebook.com/docs/graph-api/changelog/version26.0
    last_verified: 2026-11-27
    affected:
      - type: literal
        ids: [poll_spec]
      - type: pattern
        pattern: '["'']type["'']\s*:\s*["'']poll["'']'
        context: [interactive_components_spec]
