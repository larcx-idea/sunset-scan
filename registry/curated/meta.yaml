  - id: meta/marketing-api-v24.0
    title: Meta Marketing API v24.0 expiration (facebook-business SDK 24.x)
    vendor: Meta
    kind: behavior-change
    effective: 2026-10-06
    replacement: >-
      Marketing API v25.0 or newer (facebook-business / facebook-nodejs-business-sdk 25.x+)
    summary: >-
      The Marketing API expires versions sooner than the Graph API: v24.0 (released 2025-10-08)
      expires 2026-10-06 for ads endpoints. The Business SDKs track the API version in their major
      version. After that date, Meta says calls
      to the expired version may fail or be upgraded to the next available version.
    source: https://developers.facebook.com/docs/graph-api/changelog/versions
    last_verified: 2026-11-27
    affected:
      - type: pypi
        ids: [facebook-business]
        versions: '>=24.0.0, <25.0.0'
      - type: npm
        ids: [facebook-nodejs-business-sdk]
        versions: '>=24.0.0, <25.0.0'
      - type: pattern
        pattern: graph\.facebook\.com/v24\.0/act_
      - type: pattern
        pattern: api_version\s*=\s*["']v24\.0["']
        context: [facebookadsapi, facebook_business, adaccount]
