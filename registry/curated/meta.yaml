  - id: meta/commerce-order-management-api
    title: Meta Commerce Order Management API removed from all Graph API versions
    vendor: Meta
    kind: shutdown
    effective: 2026-10-27
    announced: 2026-07-29
    replacement: >-
      None: Checkout on Facebook and Instagram Shops was sunset and Meta offers no replacement API
    summary: >-
      Blocked on v26.0+ from 2026-07-29 and removed from every remaining version on 2026-10-27 (47
      endpoints, including /{page-id}/commerce_orders and /{commerce-order-id}/items, shipments,
      refunds).
    source: https://developers.facebook.com/docs/graph-api/changelog/version26.0
    last_verified: 2026-11-27
    affected:
      - type: literal
        ids: [commerce_orders, commerce_returns]
      - type: pattern
        pattern: '\b(?:buyer_details|tracking_info|fulfillment_locations)\b'
        context: [graph.facebook.com, facebook]
  - id: meta/graph-legacy-protocol-features
    title: 'Meta Graph API: root ?ids= requests and date_format now return errors on all versions'
    vendor: Meta
    kind: removed
    effective: 2026-10-27
    announced: 2026-07-29
    replacement: >-
      Per-object requests or supported batching; use the default date format and convert in code
    summary: >-
      Also on all versions: pretty and debug are ignored and ETag/If-None-Match caching is
      removed.
    source: https://developers.facebook.com/docs/graph-api/changelog/version26.0
    last_verified: 2026-11-27
    affected:
      - type: pattern
        pattern: graph\.facebook\.com/(?:v[0-9]+\.[0-9]+/?)?\?ids=
      - type: pattern
        pattern: '[?&]date_format=|["'']date_format["'']'
        context: [graph.facebook.com, facebook]
