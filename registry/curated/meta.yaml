# Meta Graph API and Marketing API version expiries and all-version changes.
# Sources: https://developers.facebook.com/docs/graph-api/changelog/versions and
# https://developers.facebook.com/docs/graph-api/changelog/version26.0 (verified 2026-11-27).
# Version expiries are kind: behavior-change, not shutdown: Meta upgrades calls to an expired
# version to a newer one (the Marketing API says they "may fail or be upgraded"), so the
# report says CHANGED rather than BROKEN once the date has passed.
schema_version: 1
advisories:
  - id: meta/graph-api-v25.0
    title: Meta Graph API v25.0 expiration
    vendor: Meta
    kind: behavior-change
    effective: 2028-07-29
    replacement: A current Graph API version (v26.0 was released 2026-07-29)
    summary: >-
      v25.0 was released 2026-02-18. After the expiration date, calls pinned to v25.0 no longer
      get v25.0 behaviour; test against a newer version first. Covers Graph, Instagram and
      WhatsApp Cloud API URLs.
    source: https://developers.facebook.com/docs/graph-api/changelog/versions
    last_verified: 2026-11-27
    affected:
      - type: pattern
        pattern: graph\.(?:facebook|instagram)\.com/v25\.0(?![0-9])
      - type: pattern
        pattern: '["''`]v25\.0["''`]'
        context: [facebook, instagram, whatsapp, graph_api, graph-api, graphapi, meta_api, fb_api]
      - type: pattern
        pattern: (?:graph|meta|fb|facebook)[a-z_]*version["']?\s*[=:]\s*["']?v25\.0(?![0-9])
        flags: i
